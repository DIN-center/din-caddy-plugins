name: Docker Build and Deploy
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options: [staging, production]
        default: staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - name: Configure Docker for Google Cloud Artifact Registry
        run: |
          yes | gcloud auth configure-docker ${{ secrets.GCP_ARTIFACT_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.GCP_ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY_NAME }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}

      - name: Checkout deployment repo
        uses: actions/checkout@v4
        with:
          repository: DIN-center/din-gateway-deployment
          ref: beta
          token: ${{ secrets.GH_PAT }}
          path: deployment

      - name: Update image version in deployment config
        uses: mikefarah/yq@master
        with:
          cmd: yq e -i ".image_version = env(GITHUB_SHA)" deployment/config.yaml
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Commit and push changes
        run: |
          cd deployment
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add config.yaml
          git commit -m "Update image_version to ${GITHUB_SHA}" || echo "No changes to commit"
          git push origin HEAD:beta
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}