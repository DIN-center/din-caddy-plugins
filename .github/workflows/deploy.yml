---
name: Deploy Caddy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options: [staging, production]
        default: staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      GOPRIVATE: github.com/DIN-center

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure GitHub auth
        run: git config --global url."https://${{ secrets.GH_TOKEN }}:@github.com/".insteadOf "https://github.com/"

      - name: Generate Caddyfile from secrets
        env:
          # Auto-generated secret mappings
          # Run 'make secrets-update-ci' to regenerate
          BLASTAPI_KEY_1: ${{ secrets.BLASTAPI_KEY_1 }}
          BLASTAPI_KEY_2: ${{ secrets.BLASTAPI_KEY_2 }}
          BLASTAPI_KEY_3: ${{ secrets.BLASTAPI_KEY_3 }}
          BLASTAPI_KEY_4: ${{ secrets.BLASTAPI_KEY_4 }}
          BLASTAPI_KEY_5: ${{ secrets.BLASTAPI_KEY_5 }}
          BLOCKPI_ARB_KEY: ${{ secrets.BLOCKPI_ARB_KEY }}
          BLOCKPI_ARB_SEPOLIA_KEY: ${{ secrets.BLOCKPI_ARB_SEPOLIA_KEY }}
          BLOCKPI_SEI_MAINNET_ARCHIVE_KEY: ${{ secrets.BLOCKPI_SEI_MAINNET_ARCHIVE_KEY }}
          BLOCKPI_SEI_MAINNET_KEY: ${{ secrets.BLOCKPI_SEI_MAINNET_KEY }}
          BLOCKPI_SEI_TESTNET_KEY: ${{ secrets.BLOCKPI_SEI_TESTNET_KEY }}
          CHAINSTACK_ARB_KEY: ${{ secrets.CHAINSTACK_ARB_KEY }}
          CHAINSTACK_BASE_MAINNET_KEY: ${{ secrets.CHAINSTACK_BASE_MAINNET_KEY }}
          CHAINSTACK_BASE_SEPOLIA_KEY: ${{ secrets.CHAINSTACK_BASE_SEPOLIA_KEY }}
          CHAINSTACK_BEACON_AUTH: ${{ secrets.CHAINSTACK_BEACON_AUTH }}
          CHAINSTACK_BSC_KEY: ${{ secrets.CHAINSTACK_BSC_KEY }}
          CHAINSTACK_BSC_TESTNET_KEY: ${{ secrets.CHAINSTACK_BSC_TESTNET_KEY }}
          CHAINSTACK_STARKNET_MAINNET_KEY: ${{ secrets.CHAINSTACK_STARKNET_MAINNET_KEY }}
          CHAINSTACK_STARKNET_SEPOLIA_KEY: ${{ secrets.CHAINSTACK_STARKNET_SEPOLIA_KEY }}
          CHAINSTACK_ZKSYNC_SEPOLIA_KEY: ${{ secrets.CHAINSTACK_ZKSYNC_SEPOLIA_KEY }}
          EVERSTAKE_SCROLL_MAINNET_KEY: ${{ secrets.EVERSTAKE_SCROLL_MAINNET_KEY }}
          EVERSTAKE_SCROLL_PATH_MAINNET: ${{ secrets.EVERSTAKE_SCROLL_PATH_MAINNET }}
          EVERSTAKE_SCROLL_PATH_SEPOLIA: ${{ secrets.EVERSTAKE_SCROLL_PATH_SEPOLIA }}
          EVERSTAKE_SCROLL_SEPOLIA_KEY: ${{ secrets.EVERSTAKE_SCROLL_SEPOLIA_KEY }}
          EXTRNODE_SOLANA_DEVNET_KEY: ${{ secrets.EXTRNODE_SOLANA_DEVNET_KEY }}
          EXTRNODE_SOLANA_MAINNET_KEY: ${{ secrets.EXTRNODE_SOLANA_MAINNET_KEY }}
          INFSTONES_BSC_KEY: ${{ secrets.INFSTONES_BSC_KEY }}
          INFSTONES_OPBNB_KEY: ${{ secrets.INFSTONES_OPBNB_KEY }}
          INFSTONES_POLYGON_KEY: ${{ secrets.INFSTONES_POLYGON_KEY }}
          INFSTONES_SWELL_KEY: ${{ secrets.INFSTONES_SWELL_KEY }}
          INFSTONES_UNICHAIN_KEY: ${{ secrets.INFSTONES_UNICHAIN_KEY }}
          LIQUIFY_BSC_KEY: ${{ secrets.LIQUIFY_BSC_KEY }}
          LIQUIFY_HOODI_KEY: ${{ secrets.LIQUIFY_HOODI_KEY }}
          LIQUIFY_INFURA_KEY: ${{ secrets.LIQUIFY_INFURA_KEY }}
          LIQUIFY_ZKSYNC_KEY: ${{ secrets.LIQUIFY_ZKSYNC_KEY }}
          LIQUIFY_ZKSYNC_SEPOLIA_KEY: ${{ secrets.LIQUIFY_ZKSYNC_SEPOLIA_KEY }}
          MONAD_MAINNET_KEY: ${{ secrets.MONAD_MAINNET_KEY }}
          MONAD_TESTNET_KEY: ${{ secrets.MONAD_TESTNET_KEY }}
          NODEFLEET_API_KEY: ${{ secrets.NODEFLEET_API_KEY }}
          NODIES_BLAST_MAINNET_KEY: ${{ secrets.NODIES_BLAST_MAINNET_KEY }}
          NODIES_BLAST_TESTNET_KEY: ${{ secrets.NODIES_BLAST_TESTNET_KEY }}
          NODIES_SCROLL_MAINNET_KEY: ${{ secrets.NODIES_SCROLL_MAINNET_KEY }}
          NODIES_SCROLL_SEPOLIA_KEY: ${{ secrets.NODIES_SCROLL_SEPOLIA_KEY }}
          NODIES_SEI_MAINNET_KEY: ${{ secrets.NODIES_SEI_MAINNET_KEY }}
          NODIES_SEI_TESTNET_KEY: ${{ secrets.NODIES_SEI_TESTNET_KEY }}
          NORTHWESTNODES_SWELL_KEY: ${{ secrets.NORTHWESTNODES_SWELL_KEY }}
          NORTHWESTNODES_ZKSYNC_KEY: ${{ secrets.NORTHWESTNODES_ZKSYNC_KEY }}
          OXFURY_API_KEY: ${{ secrets.OXFURY_API_KEY }}
          P2PIFY_ZKSYNC_KEY_1: ${{ secrets.P2PIFY_ZKSYNC_KEY_1 }}
          P2PIFY_ZKSYNC_KEY_2: ${{ secrets.P2PIFY_ZKSYNC_KEY_2 }}
          RPCPOOL_SOLANA_DEVNET_KEY: ${{ secrets.RPCPOOL_SOLANA_DEVNET_KEY }}
          RPCPOOL_SOLANA_MAINNET_KEY: ${{ secrets.RPCPOOL_SOLANA_MAINNET_KEY }}
          VALIDATIONCLOUD_BITCOIN_KEY_1: ${{ secrets.VALIDATIONCLOUD_BITCOIN_KEY_1 }}
          VALIDATIONCLOUD_BITCOIN_KEY_2: ${{ secrets.VALIDATIONCLOUD_BITCOIN_KEY_2 }}
          VALIDATIONCLOUD_BITCOIN_MAINNET_KEY: ${{ secrets.VALIDATIONCLOUD_BITCOIN_MAINNET_KEY }}
          VALIDATIONCLOUD_BSC_KEY_1: ${{ secrets.VALIDATIONCLOUD_BSC_KEY_1 }}
          VALIDATIONCLOUD_BSC_KEY_2: ${{ secrets.VALIDATIONCLOUD_BSC_KEY_2 }}
          VALIDATIONCLOUD_BSC_KEY_3: ${{ secrets.VALIDATIONCLOUD_BSC_KEY_3 }}
          VALIDATIONCLOUD_BSC_TESTNET_KEY: ${{ secrets.VALIDATIONCLOUD_BSC_TESTNET_KEY }}
          VALIDATIONCLOUD_OPBNB_MAINNET_KEY: ${{ secrets.VALIDATIONCLOUD_OPBNB_MAINNET_KEY }}
          VALIDATIONCLOUD_OPBNB_TESTNET_KEY: ${{ secrets.VALIDATIONCLOUD_OPBNB_TESTNET_KEY }}
        run: |
          go run scripts/generate-caddyfile.go \
            -template=Caddyfile \
            -output=Caddyfile \
            -use-env=true \
            -strict=true

          # Verify no placeholders remain
          if grep -q '{{.*}}' Caddyfile; then
            echo "Error: Unreplaced placeholders found"
            grep '{{.*}}' Caddyfile
            exit 1
          fi

      - name: Build Caddy
        run: |
          go mod tidy
          go build -o caddy cmd/caddy/main.go

      - name: Test configuration
        run: ./caddy validate --config Caddyfile

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ github.sha }}
          path: |
            caddy
            Caddyfile

      # Add your deployment steps here