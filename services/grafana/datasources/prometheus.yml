apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      exemplarTraceIdDestinations:
        - name: traceID
          url: 'http://localhost:3000/explore?orgId=1&left=%5B%22now-1h%22,%22now%22,%22Loki%22,%7B%22query%22:%22$${__value.raw}%22%7D%5D'
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
    basicAuth: false
    isDefault: true
    editable: false 