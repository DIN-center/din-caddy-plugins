extensions:
  health_check:
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'din-caddy-metrics-collector'
          scrape_interval: 60s #default 60s
          static_configs:
            - targets: ['din-caddy:2019']
  otlp:
    # https://github.com/open-telemetry/opentelemetry-collector/tree/main/receiver/otlpreceiver
    protocols:
      grpc:
      http:
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"
  filelog:
    include: [/srv/caddy.log]
    start_at: beginning # This ensures that the collector starts reading from the beginning of the log file
    operators:
      - type: json_parser
        id: caddy_log_parser

processors:
  batch:
    # https://github.com/open-telemetry/opentelemetry-collector/tree/main/processor/batchprocessor
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

exporters:
  otlp:
    endpoint: "ingest.us.signoz.cloud:443"
    timeout: 30s
    tls:
      insecure: false
    headers:
      "signoz-access-token": ""
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    tenant_id: "tenant1"
    labels:
      attributes:
        service.name: "service"
      resource:
        container.name: "container"
  logging:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, batch]
      exporters: [otlp, loki]
  telemetry:
    metrics:
      level: detailed
      address: ':8888'
